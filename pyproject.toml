[project]
name = "ganviz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "albucore",
  "click",
  "gdown",
  "glfw",
  "gputil",
  "imagecodecs[all]>=2025.3.30",
  "imgui==2.0.0",
  "imgui-bundle==1.5.2",
  "insightface",
  "lpips",
  "ninja",
  "onnxruntime",
  "opencv-python",
  "pandas>=2.3.3",
  "pillow",
  "plyfile",
  "pynvml",
  "pyopengl",
  "requests",
  "setuptools>=80.9.0",
  "torch",
  "tqdm",
  "torchvision",
  "diff-gaussian-rasterization",
]
[tool.uv.extra-build-dependencies]
file = ["setuptools"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "torchvision-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
diff-gaussian-rasterization= { path = "./diff-gaussian-rasterization" }



[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "torchvision-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true